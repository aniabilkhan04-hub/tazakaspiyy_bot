<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Стрелка как в логотипе колледжа -->
  <path d="M 140 380 L 256 200 L 340 320 L 400 260" 
        fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Лист экологии -->
  <path d="M 256 100 Q 360 200 256 300 Q 152 200 256 100 Z" 
        fill="url(#leaf)" opacity="0.95"/>

  <!-- Круг снизу -->
  <circle cx="256" cy="400" r="30" fill="white" opacity="0.9"/>

  <!-- Буква Т -->
  <text x="256" y="240" font-family="Arial, sans-serif" font-size="80" font-weight="bold" 
        fill="white" text-anchor="middle">Т</text>
</svg>